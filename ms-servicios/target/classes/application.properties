# ==============================================================================
# Microservicio ms-servicios - Biosur Terreno (Puerto 8081)
# ==============================================================================
server.port=8081
spring.application.name=ms-servicios

# Base de datos H2 persistente en archivo local
spring.datasource.url=jdbc:h2:file:./data/biosur_servicios_db;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.hibernate.Driver
spring.datasource.username=sa
spring.datasource.password=

# Consola web de H2 (http://localhost:8081/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JPA e Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Swagger / OpenAPI 3 (http://localhost:8081/swagger-ui.html)
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
